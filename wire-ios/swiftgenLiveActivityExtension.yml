# Every input/output paths in the rest of the config will then be expressed relative to these.

input_dir: Wire Live Activity/
output_dir: Wire Live Activity/Generated/

# Generate constants for your localized strings.

strings:
  inputs:
    - Resources/Localization/Base.lproj/Localizable.strings
  filter:
  outputs:
    templateName: structured-swift5
    output: Strings+Generated.swift
