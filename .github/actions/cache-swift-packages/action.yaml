name: "Cache Swift Packages"
description: "Restore the SPM checkouts cache and always reconcile workspace state. Sharing one cache across flag combinations is safe because the cloned packages (checkouts/) don't depend on ENABLE_COUNTLY/ENABLE_DATADOG — WireAnalytics/Package.swift's WarningPrevention target keeps Countly and Datadog in the resolved graph unconditionally. The env-conditional bits (manifest.db, workspace-state.json) are regenerated by the always-on resolve step against the caller's current env. Requires PACKAGES_DIR and REPO_ROOT to be set in env."

runs:
  using: "composite"
  steps:
    - name: Restore Swift Package Dependencies Cache
      id: cache-swift-packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PACKAGES_DIR }}
        key: ${{ runner.os }}-swiftpm-project-${{ hashFiles('**/*.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

    # Always run resolve, even on cache hit. On a hit, the checkouts are reused
    # (no network) and this step only re-evaluates Package.swift against the
    # current env vars and rewrites manifest.db / workspace-state.json so the
    # subsequent build sees the correct target graph for its flag combination.
    - name: Resolve Swift Package Dependencies
      shell: bash
      run: |
        cd "$REPO_ROOT" && xcodebuild \
          -resolvePackageDependencies \
          -disableAutomaticPackageResolution \
          -clonedSourcePackagesDirPath "$PACKAGES_DIR"

    # Only save on real branch refs. PR refs (refs/pull/*) and merge-queue refs
    # (refs/heads/gh-readonly-queue/*) are sandboxed scopes that no other run can
    # read from, so saving there just consumes the 10 GB repo cache quota and can
    # evict develop's cache (the one all PRs actually benefit from).
    - name: Save Swift Package Dependencies Cache
      if: >-
        steps.cache-swift-packages.outputs.cache-hit != 'true' &&
        startsWith(github.ref, 'refs/heads/') &&
        !startsWith(github.ref, 'refs/heads/gh-readonly-queue/')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PACKAGES_DIR }}
        key: ${{ runner.os }}-swiftpm-project-${{ hashFiles('**/*.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
