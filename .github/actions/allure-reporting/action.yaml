name: "Add Allure report"

inputs:
  xcresult_search_path:
    required: false
    default: "artifacts"
  allure_artifact_name:
    required: false
    default: "allure-report-${{ github.run_number }}"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      if: always()
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Generate Allure Report
      if: always()
      shell: bash
      run: bash ./scripts/run-generate-allure-report.sh "${{ inputs.xcresult_search_path }}"

    - name: Prepare visual representation of test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action/macos@v2
      with:
        files: |
          build/reports/*.junit
          artifacts/**/*.junit
        compare_to_earlier_commit: false
        comment_title: "Test Results"

    - name: Resolve Allure artifact URL
      if: ${{ always() && github.event_name == 'pull_request' }}
      shell: bash
      run: bash ./scripts/run-allure-report-url.sh "${{ inputs.allure_artifact_name }}"

    - name: Patch Allure link into the Test Results comment
      if: ${{ always() && github.event_name == 'pull_request' }}
      shell: bash
      run: bash ./scripts/run-update-comment.sh "Test Results" "${{ inputs.allure_artifact_name }}"
