name: "Upload JUnit results to Datadog"
description: "Installs datadog-ci and uploads all *.junit files in the working directory to Datadog CI Visibility."

inputs:
  api_key:
    description: "Datadog API key"
    required: true
  service:
    description: "Service name reported to Datadog"
    required: false
    default: "wire-ios-mono"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 18

    - name: Cache datadog-ci
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: npm-datadog-ci-${{ runner.os }}-node18

    - name: Install datadog-ci
      shell: bash
      run: npm install -g @datadog/datadog-ci

    - name: Upload JUnit results
      shell: bash
      env:
        DATADOG_API_KEY: ${{ inputs.api_key }}
        DD_ENV: ci
        DATADOG_SITE: datadoghq.eu
        DD_SERVICE: ${{ inputs.service }}
      run: |
        JUNIT_FILES=$(find . -name "*.junit" -type f)
        if [ -z "$JUNIT_FILES" ]; then
          echo "No junit files found, skipping upload"
          exit 0
        fi
        echo "$JUNIT_FILES" | tr '\n' ' ' | xargs -L 1 datadog-ci junit upload --service "$DD_SERVICE" .
