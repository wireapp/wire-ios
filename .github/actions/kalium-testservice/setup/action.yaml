name: "Setup Kalium Testservice"

inputs:
  kalium_ref:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve Kalium Testservice release
      id: kalium-release
      shell: bash
      env:
        KALIUM_REF_INPUT: ${{ inputs.kalium_ref }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        ARGS=(resolve)
        if [[ -n "${KALIUM_REF_INPUT:-}" ]]; then
          ARGS+=(--ref "$KALIUM_REF_INPUT")
        fi

        if ! python3 "$GITHUB_WORKSPACE/scripts/kalium-testservice-jar.py" "${ARGS[@]}"; then
          echo "::warning::Kalium Testservice release resolution failed. Continuing without Testservice."
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "KALIUM_TESTSERVICE_AVAILABLE=false" >> "$GITHUB_ENV"
          exit 0
        fi

        echo "available=true" >> "$GITHUB_OUTPUT"

    - name: Setup Java 17 for Kalium Testservice
      if: ${{ steps.kalium-release.outputs.available == 'true' }}
      continue-on-error: true
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Restore Kalium Testservice jar cache
      id: jar-cache
      if: ${{ steps.kalium-release.outputs.available == 'true' }}
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/kalium-testservice
        key: kalium-testservice-jar-${{ runner.os }}-${{ runner.arch }}-${{ steps.kalium-release.outputs.cache_key }}

    - name: Download Kalium Testservice jar
      id: kalium-jar
      if: ${{ steps.kalium-release.outputs.available == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        JAR_PATH: ${{ runner.temp }}/kalium-testservice/testservice.jar
      run: |
        set -uo pipefail

        echo "Kalium Testservice jar cache hit: ${{ steps.jar-cache.outputs.cache-hit }}"
        if ! python3 "$GITHUB_WORKSPACE/scripts/kalium-testservice-jar.py" \
          download \
          --ref "${{ steps.kalium-release.outputs.ref }}" \
          --output "$JAR_PATH"; then
          echo "::warning::Kalium Testservice jar download or verification failed. Continuing without Testservice."
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "KALIUM_TESTSERVICE_AVAILABLE=false" >> "$GITHUB_ENV"
          exit 0
        fi

        echo "JAR=$JAR_PATH" >> "$GITHUB_ENV"
        echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
        echo "ready=true" >> "$GITHUB_OUTPUT"
        echo "Using jar: $JAR_PATH"
        ls -lh "$JAR_PATH"

    - name: Save Kalium Testservice jar cache
      if: ${{ steps.kalium-jar.outputs.ready == 'true' && steps.jar-cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/kalium-testservice
        key: kalium-testservice-jar-${{ runner.os }}-${{ runner.arch }}-${{ steps.kalium-release.outputs.cache_key }}

    - name: Start Kalium Testservice
      if: ${{ steps.kalium-jar.outputs.ready == 'true' }}
      shell: bash
      run: |
        set -uo pipefail

        CONFIG="$GITHUB_WORKSPACE/testservice/testservice-config.yml"
        if [[ ! -f "$CONFIG" ]]; then
          echo "::warning::Config not found: $CONFIG. Continuing without Testservice."
          echo "KALIUM_TESTSERVICE_AVAILABLE=false" >> "$GITHUB_ENV"
          exit 0
        fi

        if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
          echo "::warning::JAR not found: '${JAR:-}'. Continuing without Testservice."
          echo "KALIUM_TESTSERVICE_AVAILABLE=false" >> "$GITHUB_ENV"
          exit 0
        fi

        nohup java -jar "$JAR" server "$CONFIG" >"$RUNNER_TEMP/testservice.log" 2>&1 &
        echo $! > "$RUNNER_TEMP/testservice.pid"

        for i in {1..90}; do
          if curl -fsS "http://localhost:8080/api/v1/instances" >/dev/null 2>&1; then
            echo "Kalium Testservice reachable at http://localhost:8080 after ${i}s"
            echo "KALIUM_TESTSERVICE_AVAILABLE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          sleep 1
        done

        echo "::warning::Testservice not reachable. Continuing without Testservice."
        tail -n 200 "$RUNNER_TEMP/testservice.log" || true
        echo "KALIUM_TESTSERVICE_AVAILABLE=false" >> "$GITHUB_ENV"
        exit 0
