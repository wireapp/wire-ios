name: Clear GitHub Actions Cache

on:
  pull_request:
  workflow_dispatch:
    inputs:
      cache-key:
        description: "Partial cache key to clear (leave empty to clear all)"
        required: false
        default: ""

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Clear caches
        uses: actions/github-script@v7
        with:
          script: |
            const key = core.getInput('cache-key');
            const per_page = 100;
            let deleted = 0;
            let totalFound = 0;

            for await (const response of github.paginate.iterator(
              github.rest.actions.getActionsCachesList,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page,
                ref: '*' // include all branches
              }
            )) {
              const caches = response.data.actions_caches || [];
              totalFound += caches.length;

              for (const cache of caches) {
                if (!key || cache.key.includes(key)) {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id
                  });
                  core.info(`🗑️ Deleted cache: ${cache.key}`);
                  deleted++;
                }
              }
            }

            core.info(`🔍 Found ${totalFound} total caches`);
            core.info(`✅ Deleted ${deleted} cache(s)`);
