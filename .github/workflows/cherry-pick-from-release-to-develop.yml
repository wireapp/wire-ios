# GitHub Action: Cherry-pick from `release/cycle-X.Y` to next release branch or `develop`
#
# This action automates the process of cherry-picking merged PRs from release branches.
# It is triggered whenever a pull request is merged into any `release/*` branch.
#
# Target branch selection:
# - If the source branch matches `release/cycle-X.Y` pattern and `release/cycle-X.(Y+1)` exists,
#   the cherry-pick targets the next release branch (e.g., from `release/cycle-4.9` to `release/cycle-4.10`).
# - Otherwise, the cherry-pick targets `develop`.
#
# The action performs the following steps:
# 1. Checkout the merged PR.
# 2. Determine the target branch (next release branch if exists, otherwise `develop`).
# 3. If changes are made outside the specified submodule or no submodule is specified, the action proceeds.
# 4. If a submodule name is provided in the `SUBMODULE_NAME` environment variable:
#    a. The action creates a temporary branch.
#    b. Updates the submodule to its latest version from the target branch.
#    c. Commits the submodule updates.
# 5. Squashes the commit with the commit message of the merged PR (if a submodule was updated).
# 6. Cherry-picks the squashed (or original if no squashing occurred) commit to a new branch based on the target branch.
# 7. If any conflicts arise during the cherry-pick, they are committed.
# 8. The branch with the cherry-picked changes is pushed.
# 9. A new pull request is created against the target branch with the cherry-picked changes.
#

name: "Cherry-pick from release to next release or develop"

on:
    pull_request:
        branches:
            - release/*
        types:
            - closed

jobs:
    cherry-pick:
        runs-on: ubuntu-24.04
        if: github.event.pull_request.merged == true

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  lfs: 'true'
                  token: ${{ secrets.SUBMODULE_PAT }}
                  fetch-depth: 0
                  submodules: recursive

            - name: Determine target branch
              id: target-branch
              run: |
                  BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
                  
                  # Check if base branch matches release/cycle-X.Y pattern
                  if [[ "$BASE_BRANCH" =~ ^release/cycle-([0-9]+)\.([0-9]+)$ ]]; then
                      MAJOR="${BASH_REMATCH[1]}"
                      MINOR="${BASH_REMATCH[2]}"
                      
                      # Calculate next cycle (increment minor version)
                      NEXT_MINOR=$((MINOR + 1))
                      NEXT_BRANCH="release/cycle-${MAJOR}.${NEXT_MINOR}"
                      
                      # Check if next cycle branch exists
                      if git ls-remote --heads origin "$NEXT_BRANCH" | grep -q "$NEXT_BRANCH"; then
                          echo "target=$NEXT_BRANCH" >> $GITHUB_OUTPUT
                          echo "Found next release branch: $NEXT_BRANCH"
                      else
                          echo "target=develop" >> $GITHUB_OUTPUT
                          echo "Next release branch $NEXT_BRANCH not found, using develop"
                      fi
                  else
                      echo "target=develop" >> $GITHUB_OUTPUT
                      echo "Base branch $BASE_BRANCH doesn't match release/cycle-X.Y pattern, using develop"
                  fi

            - name: Cherry pick to target branch
              uses: wireapp/action-auto-cherry-pick@v1.0.2
              with:
                  target-branch: ${{ steps.target-branch.outputs.target }}
                  pr-labels: 'cherry-pick'
                  pr-title-suffix: '🍒'
