on:
  workflow_call:
    inputs:
      folders:
        type: string
      all:
        type: boolean
        default: false
        required: false
      branch:
        type: string
        required: false
      test_dependencies:
        type: boolean
        default: false
      notify:
        type: string
        required: true
        default: 'failure' # values: always | failure | never
      max_parallel:
        type: number
        default: 3
        required: false

    secrets:
      ZENKINS_USERNAME:
        required: true
      DD_API_KEY:
        required: true
      # Slack webhook this run should post to. Callers resolve which
      # environment-specific webhook to pass, e.g.
      # `NOTIFICATION_WEBHOOK_URL: ${{ secrets.WIRE_IOS_CI_WEBHOOK }}`.
      NOTIFICATION_WEBHOOK_URL:
        required: true

env: # https://docs.fastlane.tools/getting-started/ios/setup/
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  REPO_ROOT: ${{ github.workspace }}
  PACKAGES_DIR: ${{ github.workspace }}/DerivedData/CachedSwiftPackages

jobs:
  # ── 1. Determine which framework schemes need to be tested ──────────────────
  generate-framework-list:
    name: Generate framework list
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      schemes: ${{ steps.list-schemes.outputs.schemes }}
      batches: ${{ steps.list-schemes.outputs.batches }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          lfs: 'false'

      - name: Setup Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true

      - name: Load .env file
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0
        with:
          path: fastlane/

      - name: List schemes
        id: list-schemes
        env:
          FOLDERS: ${{ inputs.folders }}
          ALL: ${{ inputs.all }}
          TEST_DEPENDENCIES: ${{ inputs.test_dependencies }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        run: |
          bundle exec fastlane list_schemes_json \
            folders:"$FOLDERS" \
            all:$ALL \
            test_dependencies:$TEST_DEPENDENCIES \
            max_parallel:$MAX_PARALLEL
          RAW=$(cat /tmp/schemes.json)
          echo "schemes=$RAW" >> "$GITHUB_OUTPUT"
          echo "Schemes to test: $RAW"
          BATCHES=$(cat /tmp/batches.json)
          echo "batches=$BATCHES" >> "$GITHUB_OUTPUT"
          echo "Batches to test: $BATCHES"

  # ── 2. One job per batch (bin-packed frameworks), up to max_parallel runners ─
  test-framework:
    name: "Test batch ${{ matrix.batch_index }} (${{ matrix.schemes }})"
    needs: generate-framework-list
    if: ${{ needs.generate-framework-list.outputs.batches != '[]' && needs.generate-framework-list.outputs.batches != '' }}
    runs-on: ghcr.io/cirruslabs/macos-runner:tahoe
    permissions:
      contents: read
      pull-requests: write
      checks: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-batch-${{ matrix.batch_index }}
      cancel-in-progress: true
    strategy:
      matrix:
        include: ${{ fromJson(needs.generate-framework-list.outputs.batches) }}
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ secrets.ZENKINS_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          lfs: ${{ matrix.needs_lfs }}

      - name: Setup test environment
        uses: ./.github/actions/setup-test-environment

      - name: "Test batch ${{ matrix.batch_index }}"
        timeout-minutes: 90
        env:
          SCHEMES: ${{ matrix.schemes }}
        run: |
          for scheme in $SCHEMES; do
            bundle exec fastlane select_framework scheme:$scheme
          done

      - name: Check for duplicate symbol implementations
        if: always()
        continue-on-error: true
        run: ./scripts/check_duplicate_classes.sh .

      - name: Annotate test failures
        if: always()
        continue-on-error: true
        run: ruby scripts/annotate_test_failures.rb

      - name: Upload .xcresult as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "xcresult-batch-${{ matrix.batch_index }}-${{ env.SANITIZED_BRANCH }}-(${{ github.run_id }}-${{ github.run_attempt }})"
          path: artifacts/**/*.xcresult

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "test-reports-batch-${{ matrix.batch_index }}-${{ env.SANITIZED_BRANCH }}-(${{ github.run_id }}-${{ github.run_attempt }})"
          path: |
            build/reports/*.junit
            artifacts/**/*.junit

      - name: Upload failed snapshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "snapshots-batch-${{ matrix.batch_index }}-${{ env.SANITIZED_BRANCH }}-(${{ github.run_id }}-${{ github.run_attempt }})"
          path: |
            **/SnapshotResults/
            xcodebuild*.log

      - name: Publish test results summary
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/macos@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: |
            build/reports/*.junit
            artifacts/**/*.junit
          check_name: "Test Results – batch ${{ matrix.batch_index }}"
          compare_to_earlier_commit: false

      - name: Archive DerivedData logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "deriveddata-batch-${{ matrix.batch_index }}-${{ env.SANITIZED_BRANCH }}-(${{ github.run_id }}-${{ github.run_attempt }})"
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/**
            ~/Library/Logs/DiagnosticReports/**

  # ── 3. Notify + upload to Datadog ──────────────────────────────────────────
  post-tests:
    name: Run tests
    needs: test-framework
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Sanitize branch name
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$GH_EVENT_NAME" == "pull_request" ] || [ "$GH_EVENT_NAME" == "merge_group" ]; then
            BRANCH="$GH_HEAD_REF"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "SANITIZED_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          lfs: 'false'

      - name: Notify on Wire
        uses: ./.github/actions/notify-wire
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        with:
          notify: ${{ inputs.notify }}
          status: ${{ needs.test-framework.result }}
          branch: ${{ env.SANITIZED_BRANCH }}
          label: Tests (parallel)

      - name: Download test results
        id: download-test-results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: "test-reports-*-${{ env.SANITIZED_BRANCH }}-(${{ github.run_id }}-${{ github.run_attempt }})"
          merge-multiple: true

      - name: Upload JUnit results to Datadog
        if: steps.download-test-results.outcome == 'success'
        uses: ./.github/actions/upload-datadog-junit
        with:
          api_key: ${{ secrets.DD_API_KEY }}

      - name: Propagate test result
        if: needs.test-framework.result != 'success'
        run: |
          echo "Tests ${{ needs.test-framework.result }}"
          exit 1
