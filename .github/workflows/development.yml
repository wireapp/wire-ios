name: Edge

on:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'macOS runner'
        type: choice
        options:
          - in-house
          - cirrus
          - github
        default: in-house
  push:
    branches:
      - 'develop'

permissions: 
  checks: write

jobs:
  development:
    uses: ./.github/workflows/_reusable_app_release.yml
    with:
      mac_runner: ${{ inputs.mac_runner || vars.DEFAULT_MAC_RUNNER || 'in-house' }}
      countly_enabled: true
      datadog_enabled: true
      fastlane_action: development
      is_cloud_build: true
      produce_changelog: false
      distribute_externals: true # automatically deliver to Wire Employees
      notify_secret: WIRE_IOS_DELIVERY
    secrets: inherit
