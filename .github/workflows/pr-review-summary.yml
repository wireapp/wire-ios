name: Daily PR Review Summary

# **What it does**: Posts a daily summary of open PRs grouped by reviewer (who still needs to act)
#                   and lists PRs with 2+ approvals waiting to be merged.
# **Why we have it**: Keep reviewers informed and unblock authors waiting for a merge.
# **Who does it impact**: All contributors and reviewers of the repo.

on:
    schedule:
        - cron: '0 8 * * MON-FRI'   # Every weekday at 08:00 UTC
    workflow_dispatch:              # Allow manual runs for testing

jobs:
    pr-review-summary:
        runs-on: ubuntu-24.04
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.WIRE_IOS_CODE_REVIEW }}
        steps:
            # Needed so the local ./.github/actions/notify-wire composite action is available.
            # Only .github is required, and no LFS objects.
            -   name: Checkout
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
                with:
                    sparse-checkout: .github
                    lfs: 'false'

            -   name: Build summary message
                id: build-summary
                uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
                with:
                    script: |
                        const REQUIRED_APPROVALS = 2;

                        const releaseLabel = (pr) => {
                            const m = pr.base.ref.match(/^release\/cycle-(.+)$/);
                            return m ? `🚨 Release ${m[1]}` : null;
                        };

                        // ── 1. Fetch all open, non-draft PRs ────────────────────────────────────
                        const { data: prs } = await github.rest.pulls.list({
                            owner:    context.repo.owner,
                            repo:     context.repo.repo,
                            state:    'open',
                            per_page: 100,
                        });

                        const hasLabel = (pr, name) => pr.labels.some(l => l.name.toLowerCase() === name);
                        const isWIP = (pr) => /\b(wip)\b|\[wip\]/i.test(pr.title) || hasLabel(pr, 'wip');
                        const hasStaleLabel = (pr) => hasLabel(pr, 'stale');

                        const totalPRs    = prs.length;
                        const draftOrWIP  = prs.filter(pr => pr.draft || isWIP(pr));
                        const openPRs     = prs.filter(pr => !pr.draft && !isWIP(pr));
                        const stalePRs    = prs.filter(hasStaleLabel);
                        const cherryPicks = prs.filter(pr => hasLabel(pr, 'cherry-pick'));

                        // ── 2. For each PR collect review state ──────────────────────────────────
                        const readyToMerge = [];  // ≥ REQUIRED_APPROVALS approvals
                        const reviewerMap  = {};  // reviewer login → [{ pr, release, tag }]

                        for (const pr of openPRs) {
                            const { data: reviews } = await github.rest.pulls.listReviews({
                                owner:       context.repo.owner,
                                repo:        context.repo.repo,
                                pull_number: pr.number,
                                per_page:    100,
                            });

                            // Keep only the latest review per user (most-recent wins)
                            const latestByUser = {};
                            for (const review of reviews) {
                                if (review.state === 'DISMISSED') continue;
                                latestByUser[review.user.login] = review.state;
                            }

                            const approvalCount = Object.values(latestByUser)
                                .filter(s => s === 'APPROVED').length;

                            const release = releaseLabel(pr);

                            if (approvalCount >= REQUIRED_APPROVALS) {
                                readyToMerge.push({ pr, approvalCount, release });
                                continue;
                            }

                            // Who still needs to act:
                            // - explicitly requested reviewers (haven't reviewed yet)
                            // - anyone who left CHANGES_REQUESTED (may need to re-review after updates)
                            const pending = new Set(pr.requested_reviewers.map(r => r.login));
                            for (const [login, state] of Object.entries(latestByUser)) {
                                if (state === 'CHANGES_REQUESTED') pending.add(login);
                            }
                            pending.delete(pr.user.login); // exclude the author

                            for (const reviewer of pending) {
                                if (!reviewerMap[reviewer]) reviewerMap[reviewer] = [];
                                const tag = latestByUser[reviewer] === 'CHANGES_REQUESTED'
                                    ? ' *(changes requested — waiting for author update)*'
                                    : '';
                                reviewerMap[reviewer].push({ pr, release, tag });
                            }
                        }

                        const formatPR = ({ pr, release, tag = '' }) => {
                            const prefix = release ? `**[${release}]** ` : '';
                            return `  • ${prefix}[#${pr.number}](${pr.html_url}) ${pr.title}${tag}`;
                        };

                        // ── 3. Format the message ────────────────────────────────────────────────
                        const lines = [];

                        lines.push(`**📋 PR Review Summary — ${new Date().toDateString()}**`);
                        lines.push('');

                        lines.push('**Totals**');
                        lines.push(`  • Total open PRs: ${totalPRs}`);
                        lines.push(`  • Ready to review: ${openPRs.length}`);
                        lines.push(`  • Draft or WIP: ${draftOrWIP.length}`);
                        lines.push(`  • Stale: ${stalePRs.length}`);
                        lines.push(`  • Cherry-picks 🍒: ${cherryPicks.length}`);
                        lines.push('');

                        const reviewers = Object.keys(reviewerMap).sort();
                        if (reviewers.length === 0) {
                            lines.push('✅ No PRs are waiting for a reviewer right now.');
                        } else {
                            lines.push('**PRs needing your attention**');
                            lines.push('');
                            for (const reviewer of reviewers) {
                                const items = reviewerMap[reviewer];
                                // Release PRs first, then the rest
                                items.sort((a, b) => (b.release ? 1 : 0) - (a.release ? 1 : 0));
                                lines.push(`**@${reviewer}**`);
                                for (const item of items) {
                                    lines.push(formatPR(item));
                                }
                                lines.push('');
                            }
                        }

                        lines.push('---');
                        lines.push('');

                        if (readyToMerge.length === 0) {
                            lines.push('🚀 No PRs are fully approved and waiting to merge.');
                        } else {
                            lines.push('**✅ Approved & waiting to merge**');
                            lines.push('');
                            // Release PRs first
                            readyToMerge.sort((a, b) => (b.release ? 1 : 0) - (a.release ? 1 : 0));
                            for (const { pr, approvalCount, release } of readyToMerge) {
                                const prefix = release ? `**[${release}]** ` : '';
                                lines.push(`  • ${prefix}[#${pr.number}](${pr.html_url}) ${pr.title} — author: **@${pr.user.login}** (${approvalCount} approvals)`);
                            }
                        }

                        core.setOutput('summary', lines.join('\n'));

            -   name: Post to Wire
                continue-on-error: true
                uses: ./.github/actions/notify-wire
                with:
                    notify: custom
                    text: ${{ steps.build-summary.outputs.summary }}
