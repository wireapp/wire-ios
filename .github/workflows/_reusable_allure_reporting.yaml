name: Allure reporting 📊

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      run_on:
        required: false
        type: string
        default: "macos-latest"
    outputs:
      allure-artifact-name:
        description: "Name of the Allure report artifact"
        value: ${{ jobs.generate_allure.outputs.artifact_name }}
      allure-artifact-url:
        description: "Direct URL to download Allure report"
        value: ${{ jobs.generate_allure.outputs.artifact_url }}

jobs:
  generate_allure:
    name: Generate Allure report
    runs-on: ${{ inputs.run_on }}
    outputs:
      artifact_name: ${{ steps.vars.outputs.allure_artifact }}
      artifact_url: ${{ steps.upload-allure.outputs.artifact-url }}

    steps:
      - name: Compute artifact names
        id: vars
        shell: bash
        run: |
          SANITIZED_BRANCH=$(echo "${{ inputs.branch_name }}" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "xcresults_artifact=XCResults for $SANITIZED_BRANCH (${{ github.run_id }} - ${{ github.run_attempt }})" >> "$GITHUB_OUTPUT"
          echo "allure_artifact=allure-report-critical-flows-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Download XCResults artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.vars.outputs.xcresults_artifact }}
          path: ./xcresults

      - name: Generate Allure HTML Report
        shell: bash
        run: |
          XCRESULT=$(find ./xcresults -type d -name "*.xcresult" | head -n 1)
          
          if [ -z "$XCRESULT" ]; then
            echo "❌ No .xcresult found"
            exit 1
          fi
          
          echo "✅ Using xcresult: $XCRESULT"
          npx allure generate "$XCRESULT" -o allure-report
          
          if [ ! -f "allure-report/index.html" ]; then
            echo "❌ Report not generated"
            exit 1
          fi
          
          if [ ! -d "allure-report/data" ]; then
            echo "❌ Report data folder missing"
            exit 1
          fi
          
          echo "✅ Allure report generated successfully"
          ls -la allure-report/data/ | head -10

      - name: Upload Allure HTML artifact
        id: upload-allure
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.allure_artifact }}
          path: allure-report/
          retention-days: 30
          if-no-files-found: error

      - name: Add to Job Summary
        shell: bash
        run: |
          {
            echo "## 📊 Allure Report Generated Successfully";
            echo "";
            echo "**Artifact Name:** \`${{ steps.vars.outputs.allure_artifact }}\`";
            echo "";
            echo "### 📥 How to View the Report";
            echo "";
            echo "1. Click the download link below or scroll to **Artifacts** section";
            echo "2. Download and extract the ZIP file";
            echo "3. Double-click **index.html** to open in your browser";
            echo "";
            echo "---";
            echo "";
            echo "_Report retention: 30 days_";
          } >> "$GITHUB_STEP_SUMMARY"
