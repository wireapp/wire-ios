name: Allure reporting 📊

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      run_on:
        required: false
        type: string
        default: "ubuntu-latest"
    outputs:
      allure-artifact-name:
        description: "Name of the Allure report artifact"
        value: ${{ jobs.generate_allure.outputs.artifact_name }}
      allure-artifact-url:
        description: "Direct URL to download Allure report"
        value: ${{ jobs.generate_allure.outputs.artifact_url }}

jobs:
  generate_allure:
    name: Generate Allure report
    runs-on: ${{ inputs.run_on }}
    outputs:
      artifact_name: ${{ steps.vars.outputs.allure_artifact }}
      artifact_url: ${{ steps.upload-allure.outputs.artifact-url }}

    steps:
      - name: Compute artifact names
        id: vars
        shell: bash
        run: |
          SANITIZED_BRANCH=$(echo "${{ inputs.branch_name }}" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "xcresults_artifact=XCResults for $SANITIZED_BRANCH (${{ github.run_id }} - ${{ github.run_attempt }})" >> "$GITHUB_OUTPUT"
          echo "allure_artifact=allure-report-critical-flows-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Download XCResults artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.vars.outputs.xcresults_artifact }}
          path: ./xcresults

      - name: Install xcresults converter
        shell: bash
        run: |
          DOWNLOAD_URL="https://github.com/eroshenkoam/xcresults/releases/latest/download/xcresults"
          curl -sL "${DOWNLOAD_URL}" -o ./xcresults-tool
          chmod +x ./xcresults-tool

      - name: Convert xcresult to Allure format
        shell: bash
        run: |
          # Find all .xcresult bundles and convert them
          find ./xcresults -type d -name "*.xcresult" -exec ./xcresults-tool export {} allure-results \;
          
          # Verify we have results
          if [ ! -d "allure-results" ] || [ -z "$(ls -A allure-results)" ]; then
            echo "❌ No Allure results generated"
            exit 1
          fi
          
          echo "✅ Allure results generated:"
          ls -la allure-results

      - name: Install Allure
        shell: bash
        run: |
          npm install -g allure-commandline

      - name: Generate Allure HTML Report
        shell: bash
        run: |
          allure generate allure-results -o allure-report
          echo "✅ Allure report generated:"
          ls -la allure-report

      - name: Upload Allure HTML artifact
        id: upload-allure
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.allure_artifact }}
          path: allure-report/
          retention-days: 30
          if-no-files-found: error

      - name: Add to Job Summary
        shell: bash
        run: |
          {
            echo "## 📊 Allure Report Generated Successfully";
            echo "";
            echo "**Artifact Name:** \`${{ steps.vars.outputs.allure_artifact }}\`";
            echo "";
            echo "### 📥 How to View the Report";
            echo "";
            echo "1. Download the artifact from the **Artifacts** section below";
            echo "2. Extract the ZIP file";
            echo "3. Open **index.html** in your browser";
            echo "";
            echo "---";
            echo "";
            echo "_Report retention: 30 days_";
          } >> "$GITHUB_STEP_SUMMARY"
