name: Localization Reminder

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/en.lproj/*.strings'
      - '**/Base.lproj/*.strings'
      - '**/*.xcstrings'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-localizations:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Collect new string keys and English values
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: ./scripts/collect-new-localization-strings.sh

      - name: Post localization reminder
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_KEYS: ${{ steps.check.outputs.new_keys }}
          HAS_NEW_STRINGS: ${{ steps.check.outputs.has_new_strings }}
        run: ruby ./scripts/post_localization_reminder_comment.rb

      - name: Send Wire notification
        if: steps.check.outputs.has_new_strings == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WIRE_IOS_LOCALIZATIONS_WEBHOOK }}
        uses: ./.github/actions/notify-wire
        with:
          notify: custom
          text: ${{ steps.check.outputs.message }}
