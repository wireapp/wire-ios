name: Playground

on:
  workflow_dispatch:
    inputs:
      base_branches:
        type: string
        description: 'Comma-separated list of base branches to test (e.g., release/cycle-4.9,release/cycle-5.0,develop)'
        required: true
        default: 'release/cycle-4.9'

jobs:
  determine-target-branch:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine target branches
        id: target-branches
        run: |
          BASE_BRANCHES="${{ inputs.base_branches }}"
          
          # Split comma-separated branches and process each
          IFS=',' read -ra BRANCH_ARRAY <<< "$BASE_BRANCHES"
          
          RESULTS=()
          for BASE_BRANCH in "${BRANCH_ARRAY[@]}"; do
            # Trim whitespace
            BASE_BRANCH=$(echo "$BASE_BRANCH" | xargs)
            
            echo ""
            echo "Processing: $BASE_BRANCH"
            
            # Check if base branch matches release/cycle-X.Y pattern
            if [[ "$BASE_BRANCH" =~ ^release/cycle-([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                
                # Calculate next cycle (increment minor version)
                NEXT_MINOR=$((MINOR + 1))
                NEXT_BRANCH="release/cycle-${MAJOR}.${NEXT_MINOR}"
                
                # Check if next cycle branch exists
                if git ls-remote --heads origin "$NEXT_BRANCH" | grep -q "$NEXT_BRANCH"; then
                    TARGET="$NEXT_BRANCH"
                    echo "  ✓ Found next release branch: $NEXT_BRANCH"
                else
                    TARGET="develop"
                    echo "  → Next release branch $NEXT_BRANCH not found, using develop"
                fi
            else
                TARGET="develop"
                echo "  → Base branch $BASE_BRANCH doesn't match release/cycle-X.Y pattern, using develop"
            fi
            
            RESULTS+=("$BASE_BRANCH → $TARGET")
          done
          
          # Output summary
          echo ""
          echo "=== Summary ==="
          printf '%s\n' "${RESULTS[@]}"

      - name: Display summary
        run: |
          echo "All test cases have been processed. See the detailed output above."
