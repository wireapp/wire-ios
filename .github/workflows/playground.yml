name: Playground

on:
  workflow_dispatch:
    inputs:
      base_branch:
        type: string
        description: 'Base branch to test (e.g., release/cycle-4.9)'
        required: true
        default: 'release/cycle-4.9'

jobs:
  determine-target-branch:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine target branch
        id: target-branch
        run: |
          BASE_BRANCH="${{ inputs.base_branch }}"
          
          # Check if base branch matches release/cycle-X.Y pattern
          if [[ "$BASE_BRANCH" =~ ^release/cycle-([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              
              # Calculate next cycle (increment minor version)
              NEXT_MINOR=$((MINOR + 1))
              NEXT_BRANCH="release/cycle-${MAJOR}.${NEXT_MINOR}"
              
              # Check if next cycle branch exists
              if git ls-remote --heads origin "$NEXT_BRANCH" | grep -q "$NEXT_BRANCH"; then
                  echo "target=$NEXT_BRANCH" >> $GITHUB_OUTPUT
                  echo "Found next release branch: $NEXT_BRANCH"
              else
                  echo "target=develop" >> $GITHUB_OUTPUT
                  echo "Next release branch $NEXT_BRANCH not found, using develop"
              fi
          else
              echo "target=develop" >> $GITHUB_OUTPUT
              echo "Base branch $BASE_BRANCH doesn't match release/cycle-X.Y pattern, using develop"
          fi

      - name: Display result
        run: |
          echo "Base branch: ${{ inputs.base_branch }}"
          echo "Target branch: ${{ steps.target-branch.outputs.target }}"
