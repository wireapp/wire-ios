name: Playground

on:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'macOS runner'
        type: choice
        options:
          - in-house
          - cirrus
          - github
        default: in-house
      distribute_externals:
        type: boolean
        description: 'Distribute externally: Wire Employees and Externals - Non Wire Employees'
        default: true

permissions: 
  checks: write

jobs:
  playground:
    uses: ./.github/workflows/_reusable_app_release.yml
    with:
      mac_runner: ${{ inputs.mac_runner || vars.DEFAULT_MAC_RUNNER || 'in-house' }}
      countly_enabled: true
      datadog_enabled: true
      distribute_externals: ${{ inputs.distribute_externals }}
      fastlane_action: playground
      notify_secret: WIRE_IOS_BUILD_WEBHOOK
    secrets: inherit
