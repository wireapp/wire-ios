name: Playground

on:
  workflow_dispatch:
    inputs:
      distribute_externals:
        type: boolean
        description: 'Distribute externally'
        default: false
      configuration_path:
        type: string
        description: 'Optional build-asset folder to overlay on top of the Playground config (keeps Debug.xcconfig/Release.xcconfig from Playground), e.g. ./wire-ios-build-assets/Gov/AppStore'
        default: ''

permissions:
  checks: write

jobs:
  playground:
    uses: ./.github/workflows/_reusable_app_release.yml
    with:
      countly_enabled: true
      datadog_enabled: true
      distribute_externals: ${{ inputs.distribute_externals }}
      fastlane_action: playground
      configuration_path: ${{ inputs.configuration_path }}
    secrets: inherit
