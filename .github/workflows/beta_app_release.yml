name: Beta

on: 
  push:
    branches:
      - 'release/cycle-*' # automatically trigger a beta build when merge is done to the branch
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'macOS runner'
        type: choice
        options:
          - in-house
          - cirrus
          - github
        default: in-house
      distribute_externals:
        type: boolean
        description: 'Distribute externally: Wire Employees and Externals - Non Wire Employees (Public Beta)'
        default: false
permissions: 
  checks: write

jobs:
  testflight_beta:
    if: ${{ github.ref != format('refs/heads/{0}', vars.LTS_RELEASE) }}
    uses: ./.github/workflows/_reusable_app_release.yml
    with:
      mac_runner: ${{ inputs.mac_runner || vars.DEFAULT_MAC_RUNNER || 'in-house' }}
      countly_enabled: true
      datadog_enabled: true
      fastlane_action: testflight_beta
      distribute_externals: ${{ inputs.distribute_externals || false }}
      notify_secret: WIRE_IOS_BUILD_WEBHOOK
    secrets: inherit
