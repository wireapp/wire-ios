name: Critical Flows

on:
  workflow_dispatch:
    inputs:
      testiny_run_name:
        description: "Testiny test run name: paste the exact run name from Testiny"
        required: false
        type: string
      run_uitests:
        description: "Run Critical UITests only"
        required: false
        default: true
        type: boolean
      ui_test_scope:
        description: "UI test scope"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - calling
          - core-messenger
          - collaboration
          - integration
  push:
    branches:
      - 'develop'
      - 'release/cycle-*'  
  
# This is what will cancel the workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  critical_flows:
    uses: ./.github/workflows/_reusable_run_tests.yml
    with:
      all: false
      notify_secret: WIRE_IOS_QA_WEBHOOK
      test_dependencies: false
      run_critical_flows: true
      # Logic:
      # - default          => critical
      # - critical + scope => critical,<scope>
      # - scope only       => <scope>
      # - all UI tests     => empty tag filter
      ui_test_tags: ${{ inputs.run_uitests != false && inputs.ui_test_scope != '' && format('critical,{0}', inputs.ui_test_scope) || inputs.run_uitests != false && 'critical' || inputs.ui_test_scope }}
      testiny_run_name: ${{ inputs.testiny_run_name }}
      notify: always
      timeout_minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 90 }}
    secrets: inherit
