name: Critical Flows

on:
  workflow_dispatch:
  push:
    branches:
      - 'develop'
      - 'release/cycle-*'  
  
# This is what will cancel the workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  critical_flows:
    uses: ./.github/workflows/_reusable_run_tests.yml
    with:
      all: false
      notify_secret: WIRE_IOS_QA_WEBHOOK
      test_dependencies: false
      run_critical_flows: true
    secrets: inherit

  publish_report:
    name: Allure report
    needs: [critical_flows]
    if: always()
    uses: ./.github/workflows/_reusable_allure_reporting.yaml
    with:
      branch_name: ${{ github.ref_name }}
    secrets: inherit

  summary:
    name: Test Summary & Report
    needs: [critical_flows, publish_report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download JUnit Reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*.junit*"
          path: ./junit
      
      - name: Generate Summary
        shell: bash
        run: |
          # Count from JUnit files (same as Test Results bot uses)
          PASSED=$(find ./junit -name "*.junit" -exec grep -c '<testcase.*time=' {} \; 2>/dev/null | awk '{sum+=$1} END {print (sum?sum:0)}' || echo 0)
          FAILED=$(find ./junit -name "*.junit" -exec grep -c '<failure' {} \; 2>/dev/null | awk '{sum+=$1} END {print (sum?sum:0)}' || echo 0)
          TOTAL=$((PASSED + FAILED))
          
          echo "## 🧪 Critical Flows Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Passed:** $PASSED" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Failed:** $FAILED" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Total:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[Download Allure Report](${{ needs.publish_report.outputs.allure-artifact-url }})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`${{ needs.publish_report.outputs.allure-artifact-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }} | **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
