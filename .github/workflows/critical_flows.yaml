name: Critical Flows

on:
  workflow_dispatch:
  push:
    branches:
      - 'develop'
      - 'release/cycle-*'
  pull_request:
    branches:
      - 'develop'
      - 'release/cycle-*'
    types: [opened, synchronize]
  
# This is what will cancel the workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  critical_flows:
    uses: ./.github/workflows/_reusable_run_tests.yml
    with:
      all: false
      notify_secret: WIRE_IOS_QA_WEBHOOK
      test_dependencies: false
      run_critical_flows: true
    secrets: inherit

  publish_report:
    name: Allure report
    needs: [critical_flows]
    if: always()
    uses: ./.github/workflows/_reusable_allure_reporting.yaml
    with:
      branch_name: ${{ github.ref_name }}
    secrets: inherit

  report_summary:
    name: Report Summary
    needs: [critical_flows, publish_report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Add Download Link to Summary
        run: |
          echo "## 📊 Critical Flows Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** Critical Flows" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[Click here to download](${{ needs.publish_report.outputs.allure-artifact-url }})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`${{ needs.publish_report.outputs.allure-artifact-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📌 _Extract ZIP and open index.html to view test results_" >> $GITHUB_STEP_SUMMARY

      - name: Find existing comment if any
        id: find
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "Critical Flows Test Report"

      - name: Add/Update PR Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body: |
            ## 🔴 Critical Flows Test Report
            
            **Job Run:** #${{ github.run_number }} • [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            
            ### 📥 Download Allure Report
            🔗 **[Click to Download](${{ needs.publish_report.outputs.allure-artifact-url }})**
            
            **Artifact:** `${{ needs.publish_report.outputs.allure-artifact-name }}`
            
            ---
            📌 _Extract ZIP and open index.html to view detailed test results_
