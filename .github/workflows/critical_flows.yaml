name: Critical Flows

on:
  workflow_dispatch:
  push:
    branches:
      - 'develop'
      - 'release/cycle-*'  
  
# This is what will cancel the workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  critical_flows:
    uses: ./.github/workflows/_reusable_run_tests.yml
    with:
      all: false
      notify_secret: WIRE_IOS_QA_WEBHOOK
      test_dependencies: false
      run_critical_flows: true
    secrets: inherit

  publish_report:
    name: Allure report
    needs: [critical_flows]
    if: always()
    uses: ./.github/workflows/_reusable_allure_reporting.yaml
    with:
      branch_name: ${{ github.ref_name }}
