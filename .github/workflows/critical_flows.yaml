name: Critical Flows

on:
  workflow_dispatch:
  push:
    branches:
      - 'develop'
      - 'release/cycle-*'  
  
# This is what will cancel the workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  critical_flows:
    uses: ./.github/workflows/_reusable_run_tests.yml
    with:
      all: false
      notify_secret: WIRE_IOS_QA_WEBHOOK
      test_dependencies: false
      run_critical_flows: true
    secrets: inherit

  publish_report:
    name: Allure report
    needs: [critical_flows]
    if: always()
    uses: ./.github/workflows/_reusable_allure_reporting.yaml
    with:
      branch_name: ${{ github.ref_name }}
    secrets: inherit

  summary:
    name: Test Summary & Report
    needs: [critical_flows, publish_report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download XCResults
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.critical_flows.outputs.xcresults_artifact }}
          path: ./xcresults

      - name: Generate Summary
        shell: bash
        run: |
          XCRESULT=$(find ./xcresults -name "*.xcresult" | head -1)
          
          PASSED=$(xcrun xccov parse "$XCRESULT" | grep -c "passed")
          FAILED=$(xcrun xccov parse "$XCRESULT" | grep -c "failed")
          SKIPPED=$(xcrun xccov parse "$XCRESULT" | grep -c "skipped")
          TOTAL=$((PASSED + FAILED + SKIPPED))
          
          echo "## 🧪 Critical Flows Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Passed:** $PASSED" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Failed:** $FAILED" >> $GITHUB_STEP_SUMMARY
          echo "⏭ **Skipped:** $SKIPPED" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Total:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[Download Allure Report](${{ needs.publish_report.outputs.allure-artifact-url }})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`${{ needs.publish_report.outputs.allure-artifact-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }} | **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
    
    
      - name: PR Comment
        if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.critical_flows.result == 'success'
        run: |
          gh pr comment ${{ github.event.pull_request.number || github.event.issue.number }} --body "\
            ## 🧪 Critical Flows Test Summary

            ✅ **Passed:** $PASSED
            ❌ **Failed:** $FAILED
            ⏭ **Skipped:** $SKIPPED
            📊 **Total:** $TOTAL

            🔗 **[Download Allure Report](${{ needs.publish_report.outputs.allure-artifact-url }})**
            **Artifact:** \`${{ needs.publish_report.outputs.allure-artifact-name }}\`
            **Run:** #${{ github.run_number }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
