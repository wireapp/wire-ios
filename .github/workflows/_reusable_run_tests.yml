on:
  workflow_call:
    inputs:
      folders:
        type: string
      all:
        type: boolean
        default: false
        required: false
      branch:
        type: string
        required: false
      notify_secret:
        type: string
        required: true
      test_dependencies:
        type: boolean
        default: false
      run_critical_flows:
        type: boolean
        required: true
      kalium_ref:
        type: string
        required: false
        default: ''
      testiny_run_name:
        type: string
        required: false
        default: ''
      notify:
        type: string
        required: true
        default: 'failure' # values: always | failure | never

    secrets:
      ZENKINS_USERNAME:
        required: true
      DD_API_KEY:
        required: true
      UI_TEST_LOGIN_EMAIL:
        required: true
      UI_TEST_LOGIN_PASSWORD:
        required: true
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

env: # https://docs.fastlane.tools/getting-started/ios/setup/
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  REPO_ROOT: ${{ github.workspace }}
  PACKAGES_DIR: ${{ github.workspace }}/DerivedData/CachedSwiftPackages
  UI_TEST_LOGIN_EMAIL: ${{ secrets.UI_TEST_LOGIN_EMAIL }}
  UI_TEST_LOGIN_PASSWORD: ${{ secrets.UI_TEST_LOGIN_PASSWORD }}

jobs:
  run-tests:
    name: Run tests
    runs-on: ghcr.io/cirruslabs/macos-runner:tahoe
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      xcresult_files: ${{ steps.find-xcresults.outputs.xcresult_files }}
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ secrets.ZENKINS_USERNAME }}
      SLACK_WEBHOOK_URL: ${{ secrets[inputs.notify_secret] }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          lfs: 'true'

      - name: Sanitize branch name
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            BRANCH="${{ inputs.branch }}"
          elif [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event_name }}" == "merge_group" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          SANITIZED_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "SANITIZED_BRANCH=$SANITIZED_BRANCH" | tee -a "$GITHUB_ENV"
    
      - name: Retrieve Xcode version
        run: |
          echo "XCODE_VERSION=$(cat .xcode-version)" >> $GITHUB_OUTPUT
        id: xcode-version

      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ steps.xcode-version.outputs.XCODE_VERSION }}

      - name: Load .env file
        uses: xom9ikk/dotenv@v2
        with:
          path: fastlane/

      - name: Restore Carthage Cache
        uses: actions/cache@v3
        id: cache-carthage
        with:
          path: Carthage
          key: ${{ runner.os }}-xcode${{ steps.xcode-version.outputs.XCODE_VERSION }}-carthage-${{ hashFiles('Cartfile.resolved') }}

      - name: Bootstrap Carthage if no cache
        if: steps.cache-carthage.outputs.cache-hit != 'true'
        run: ./scripts/carthage.sh bootstrap --platform ios --use-xcframeworks

        # Restore Swift Package Dependencies Cache
      - name: Restore Swift Package Dependencies Cache
        id: cache-swift-packages
        uses: actions/cache@v3
        with:
          path: ${{ env.PACKAGES_DIR }}
          key: ${{ runner.os }}-swiftpm-project-${{ hashFiles('**/*.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-false

        # Resolve Swift Package Dependencies
      - name: Resolve Swift Package Dependencies
        run: |
          ( cd $REPO_ROOT && xcodebuild -resolvePackageDependencies -disableAutomaticPackageResolution -clonedSourcePackagesDirPath "$PACKAGES_DIR" )

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install ImageMagick
        uses: gerlero/brew-install@v1
        with:
          packages: imagemagick ghostscript freetype

      - name: Display all fastlane lanes
        if: ${{ contains(inputs.folders, 'fastlane') || inputs.all }}
        run: |
          bundle exec fastlane lanes

      - name: Setup workspace
        run: |
          ./setup.sh

      - name: Setup simulator
        run: |
          bundle exec fastlane prepare_for_tests

      - name: Resolve Kalium ref
        if: ${{ inputs.run_critical_flows }}
        id: kalium-ref
        shell: bash
        env:
          KALIUM_REF_INPUT: ${{ inputs.kalium_ref }}
        run: |
          set -euo pipefail

          if [[ -n "${KALIUM_REF_INPUT:-}" ]]; then
            KALIUM_REF="$KALIUM_REF_INPUT"
          else
            KALIUM_REF="$({
              git ls-remote --tags --refs https://github.com/wireapp/kalium.git 'refs/tags/test-service-v*' \
              | awk -F/ '{print $3}' \
              | sort -V \
              | tail -n 1
            })"
          fi

          if [[ -z "$KALIUM_REF" ]]; then
            echo "::error::Could not resolve Kalium testservice ref"
            exit 1
          fi

          if [[ ! "$KALIUM_REF" =~ ^test-service-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid Kalium ref: $KALIUM_REF"
            exit 1
          fi

          echo "ref=$KALIUM_REF" >> "$GITHUB_OUTPUT"
          echo "Using Kalium ref: $KALIUM_REF"

      - name: Clone Kalium
        if: ${{ inputs.run_critical_flows }}
        shell: bash
        run: |
          KALIUM_DIR="$RUNNER_TEMP/kalium"
          rm -rf "$KALIUM_DIR"
          git clone --depth 1 --branch "${{ steps.kalium-ref.outputs.ref }}" \
            https://github.com/wireapp/kalium.git "$KALIUM_DIR"

      - name: Cache Gradle dependencies
        if: ${{ inputs.run_critical_flows }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kalium-gradle-${{ runner.os }}-${{ runner.arch }}-${{ steps.kalium-ref.outputs.ref }}
          restore-keys: |
            kalium-gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Kalium fat jar cache
        if: ${{ inputs.run_critical_flows }}
        id: jar-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kalium/tools/testservice/build/libs/
          key: kalium-jar-${{ runner.os }}-${{ runner.arch }}-${{ steps.kalium-ref.outputs.ref }}
          restore-keys: |
            kalium-jar-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Java 17 for Kalium Testservice
        if: ${{ inputs.run_critical_flows }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Kalium Testservice jar
        if: ${{ inputs.run_critical_flows }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Kalium fat-jar cache hit: ${{ steps.jar-cache.outputs.cache-hit }}"

          LIBS_DIR="$RUNNER_TEMP/kalium/tools/testservice/build/libs"
          mkdir -p "$LIBS_DIR"

          # Try to find jar (either restored from cache or from a previous build in this run)
          JAR="$(ls -1 "$LIBS_DIR/"*"-all.jar" 2>/dev/null | head -n 1 || true)"

          if [[ -z "$JAR" ]]; then
            echo "Jar not found in $LIBS_DIR — so building..."
            cd "$RUNNER_TEMP/kalium"
            ./gradlew --no-daemon --parallel :tools:testservice:shadowJar
            JAR="$(ls -1 "$LIBS_DIR/"*"-all.jar" 2>/dev/null | head -n 1 || true)"
          fi

          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo "::error::Kalium fat jar not found in $LIBS_DIR"
            ls -la "$LIBS_DIR" || true
            exit 1
          fi

          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "Using jar: $JAR"
          ls -la "$LIBS_DIR"

      - name: Save Kalium fat jar cache
        if: ${{ inputs.run_critical_flows && steps.jar-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kalium/tools/testservice/build/libs/
          key: kalium-jar-${{ runner.os }}-${{ runner.arch }}-${{ steps.kalium-ref.outputs.ref }}

      - name: Start Kalium Testservice
        if: ${{ inputs.run_critical_flows }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$GITHUB_WORKSPACE/.github/testservice/testservice-config.yml"
          [[ -f "$CONFIG" ]] || { echo "::error::Config not found: $CONFIG"; exit 1; }
          [[ -n "${JAR:-}" && -f "$JAR" ]] || { echo "::error::JAR not found: '${JAR:-}'"; exit 1; }

          nohup java -jar "$JAR" server "$CONFIG" >"$RUNNER_TEMP/testservice.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/testservice.pid"

          for i in {1..90}; do
            if curl -fsS "http://localhost:8080/api/v1/instances" >/dev/null 2>&1; then
              echo "✅ Kalium Testservice reachable at http://localhost:8080 (after ${i}s)"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Testservice not reachable"
          tail -n 200 "$RUNNER_TEMP/testservice.log" || true
          exit 1

          
      - name: Install 1Password
        if: ${{ inputs.run_critical_flows }}
        uses: 1password/install-cli-action@v1

      - name: Generate env file
        if: ${{ inputs.run_critical_flows }}
        run: |
          bundle exec fastlane generate_env

      - name: "Test new critical flows"
        if: ${{ inputs.run_critical_flows }}
        run: |
          bundle exec fastlane run_uitests


      - name: Upload XCResult results to Testiny
        if: ${{ always() && inputs.run_critical_flows && inputs.testiny_run_name }}
        shell: bash
        env:
          TESTINY_RUN_NAME: ${{ inputs.testiny_run_name }}
        run: |
          set -euo pipefail
          TESTINY_API_KEY="$(op read 'op://Test Automation/TESTINY_API_KEY_IOS/password')"
          echo "::add-mask::$TESTINY_API_KEY"
          export TESTINY_API_KEY

          # Find a xcresult bundle produced by the run
          XCRESULT="$(find artifacts -type d -name '*.xcresult' | head -n 1)"
          if [ -z "$XCRESULT" ]; then
            echo "[ERROR] No .xcresult found under artifacts/"
            exit 1
          fi

          echo "[INFO] Using xcresult: $XCRESULT"

          python3 ./scripts/send_xcresult_to_testiny.py \
            --xcresult "$XCRESULT" \
            --run-name "$TESTINY_RUN_NAME" \
            --require-existing-run

      - name: "Test all selected frameworks"
        if: ${{ inputs.test_dependencies || inputs.all }}
        run: |
          bundle exec fastlane test_frameworks folders:${{ inputs.folders }} all:${{ inputs.all }}
          
      - name: "Test frameworks without dependencies"
        if: ${{ inputs.test_dependencies == false }}
        run: |
          bundle exec fastlane test_only_frameworks folders:${{ inputs.folders }}

      - name: Stop Kalium Testservice
        if: always() && inputs.run_critical_flows
        shell: bash
        run: |
          set -euo pipefail

          PID_FILE="$RUNNER_TEMP/testservice.pid"
          LOG_FILE="$RUNNER_TEMP/testservice.log"

          # Stop the service
          if [[ -f "$PID_FILE" ]]; then
            PID="$(cat "$PID_FILE" || true)"
            if [[ -n "$PID" ]]; then
              kill "$PID" 2>/dev/null || true
            fi
            rm -f "$PID_FILE" || true
          fi

          # Print logs only when the job is failing
          if [[ "${{ job.status }}" != "success" ]]; then
            if [[ -f "$LOG_FILE" ]]; then
              echo "::group::Kalium Testservice log (last 200 lines)"
              tail -n 200 "$LOG_FILE" || true
              echo "::endgroup::"
            else
              echo "::warning::No testservice.log found"
            fi
          fi

      - name: Find all .xcresult files
        if: ${{ always() && github.event_name == 'pull_request' }}
        id: find-xcresults
        run: |
          # Find all .xcresult directories and convert them to a JSON array
          files=`find artifacts -type d -name "*.xcresult" | jq -R . | jq -s .`
          echo xcresult_files=${files} >> $GITHUB_OUTPUT
      - name: Debug Print xcresult files
        run: |
          echo "xcresult files: ${{ steps.find-xcresults.outputs.xcresult_files }}"

      - name: Upload .xcresult files as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCResults for ${{ env.SANITIZED_BRANCH }} (${{ github.run_id }} - ${{ github.run_attempt}})
          path: artifacts/**/*.xcresult

      # Scripts
      - name: Test Scripts
        if: ${{ contains(inputs.folders, 'scripts') || inputs.all }}
        run: |
          echo "Scripts has changes"
          echo "Testing Scripts..."
          xcrun swift test --package-path ./scripts

      - name: Upload Failed snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Failed Snapshots and log for ${{ env.SANITIZED_BRANCH }} (${{ github.run_id }} - ${{ github.run_attempt}})
          path: |
            **/SnapshotResults/
            xcodebuild*.log

      - name: Upload Test Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test reports for ${{ env.SANITIZED_BRANCH }} (${{ github.run_id }} - ${{ github.run_attempt}})
          path: |
            build/reports/*.junit
            artifacts/**/*.junit
            app-group.zip
            fastlane/app-group.zip

      - name: Publish Test Results Summary
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        with:
          files: |
            build/reports/*.junit
            artifacts/**/*.junit
          compare_to_earlier_commit: false
          comment_title: "Test Results"

      - name: Publish test results + Allure report
        if: always()
        uses: ./.github/actions/allure-reporting
        with:
          allure_artifact_name: "html-report-${{ github.run_number }}-${{ env.SANITIZED_BRANCH }}"
          xcresult_search_path: "artifacts"

      - name: Add Allure Report to Job Summary
        if: ${{ always() && env.ALLURE_REPORT_AVAILABLE == 'true' }}
        shell: bash
        run: |
          {
            echo "## 📊 Allure Report Generated Successfully";
            echo "";
            echo "**Artifact Name:** \`html-report-${{ github.run_number }}-${{ env.SANITIZED_BRANCH }}\`";
            echo "";
            echo "### 📥 How to View the Report";
            echo "";
            echo "1. Download and extract the ZIP file";
            echo "2. **Double-click index.html** to open in your browser";
            echo "";
            echo "---";
            echo "";
            echo "_Report retention depends on repository artifact settings_";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Allure Report Not Generated to Job Summary
        if: ${{ always() && env.ALLURE_REPORT_AVAILABLE != 'true' }}
        shell: bash
        run: |
          {
            echo "## 📊 Allure Report";
            echo "";
            echo "⚠️ No \`.xcresult\` found under \`artifacts\`. Allure report was not generated.";
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Archiving DerivedData Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Derived Data Xcode for ${{env.SANITIZED_BRANCH }} (${{ github.run_id }} - ${{ github.run_attempt}})
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/**
            ~/Library/Logs/DiagnosticReports/**

      - name: Get Commit Info
        if: always()
        id: get_commit_sha
        run: |
            echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_ENV
            echo "commit_message=$(git log -1 --pretty=format:"%s")" >> $GITHUB_ENV

      - name: Always Notify on Wire
        uses: 8398a7/action-slack@v3
        continue-on-error: true
        if:  ${{ inputs.notify == 'always'  && always() }}
        with:
          status: ${{ job.status }}
          text: |
            **Tests for ${{ env.SANITIZED_BRANCH }}**

            **Title:** ${{ env.commit_message }}
            **Commit:** [${{ env.commit_sha }}](https://github.com/wireapp/wire-ios-mono/commit/${{ env.commit_sha }})
            **Triggered by:** ${{ github.triggering_actor }}
            **Build log:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      
      - name: Only Notify on Wire failures
        uses: 8398a7/action-slack@v3
        continue-on-error: true
        if: ${{ inputs.notify == 'failure' && failure() }}
        with:
          status: ${{ job.status }}
          text: |
            **🚨 Tests for ${{ env.SANITIZED_BRANCH }} failed 🆘**

            **Title:** ${{ env.commit_message }}
            **Commit:** [${{ env.commit_sha }}](https://github.com/wireapp/wire-ios/commit/${{ env.commit_sha }})
            **Triggered by:** ${{ github.triggering_actor }}
            **Build log:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  analyze-xcresults:
    needs: run-tests
    name: Analyze xcresults
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ghcr.io/cirruslabs/macos-runner:sequoia
    strategy:
      matrix:
        xcresult_file: ${{ fromJson(needs.run-tests.outputs.xcresult_files) }}
      fail-fast: false # avoid to fail one job
    steps:
      - name: Sanitize branch name
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            BRANCH="${{ inputs.branch }}"
          elif [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event_name }}" == "merge_group" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          SANITIZED_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "SANITIZED_BRANCH=$SANITIZED_BRANCH" >> $GITHUB_ENV

      - name: Download .xcresult files
        uses: actions/download-artifact@v4
        with:
          name: XCResults for ${{ env.SANITIZED_BRANCH }} (${{ github.run_id }} - ${{ github.run_attempt}})
          path: ./artifacts

      - name: Display downloaded files
        run: ls -R
      
      - name: Analyze .xcresult file
        uses: wireapp/analyze-xcoderesults-action@v1
        with:
          results: ${{ matrix.xcresult_file }}
          warningAnnotations: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-test-results-datadadog:
    name: Upload to Datadog
    runs-on: ubuntu-24.04
    needs: run-tests
    if: always()
    steps:
      - name: Sanitize branch name
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            BRANCH="${{ inputs.branch }}"
          elif [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event_name }}" == "merge_group" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          SANITIZED_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "SANITIZED_BRANCH=$SANITIZED_BRANCH" >> $GITHUB_ENV

      - name: Download tests results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Test reports for ${{ env.SANITIZED_BRANCH }} (${{ github.run_id }} - ${{ github.run_attempt}})
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install datadog-ci
        run: npm install -g @datadog/datadog-ci
      - name: "Upload results"
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_ENV: ci
          DATADOG_SITE: datadoghq.eu
        run: |
          find . -name "*.junit" -type f | tr '\n' ' ' | xargs -L 1 datadog-ci junit upload --service wire-ios-mono .
