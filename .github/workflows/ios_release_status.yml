name: Daily iOS Release Status

# **What it does**: Posts a daily Jira-driven status of the three live iOS releases
#                   — Edge (develop), Beta (latest release/cycle-*), Prod (latest appstore/* tag).
# **Why we have it**: Surface QA load, triage backlog, and release dates without anyone hunting in Jira.
# **Who does it impact**: iOS release managers, QA, and engineers owning ticket triage.
#
# Required secrets:
#   JIRA_TOKEN          — Same secret used by jira_lint_and_link.yml.
#   WIRE_IOS_RELEASES   — Slack webhook URL for the channel that receives the report.

on:
  schedule:
    # GitHub cron is UTC-only, so this drifts with DST: ~07:00 Berlin in summer
    # (CEST, UTC+2), ~06:00 in winter (CET, UTC+1). Scheduled deliberately early so
    # that even with GitHub's scheduled-run delay (15 min to a couple of hours) it
    # still lands as the first status of the morning, around 8am Berlin.
    - cron: '0 5 * * MON-FRI'   # 05:00 UTC weekdays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-status:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      JIRA_BASE_URL: https://wearezeta.atlassian.net
      JIRA_PROJECT: WPB
      # Optional: full branch name of the current LTS C-build release (e.g. release/cycle-4.18).
      # When set, an extra LTS section is appended to the report.
      LTS_RELEASE: ${{ vars.LTS_RELEASE }}
      # Optional: full branch name of an additionally tracked release (e.g. release/cycle-4.20).
      # When set, and the Jira version isn't yet released, an extra GOV section is appended to the report.
      GOV_RELEASE: ${{ vars.GOV_RELEASE }}
    steps:
      # Needed so the local ./.github/actions/notify-wire composite action is available.
      # Only .github is required, and no LFS objects.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          lfs: 'false'

      - name: Build release report
        id: build
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        with:
          script: |
            const VERSION_FILE = 'wire-ios/Wire-iOS/Resources/Configuration/Version.xcconfig';
            const base    = process.env.JIRA_BASE_URL;
            const project = process.env.JIRA_PROJECT;

            if (!process.env.JIRA_TOKEN) {
              throw new Error('JIRA_TOKEN secret is required');
            }
            const authHeader = `Basic ${Buffer.from(process.env.JIRA_TOKEN).toString('base64')}`;

            const jira = async (path, body = null) => {
              const headers = { Authorization: authHeader, Accept: 'application/json' };
              if (body) headers['Content-Type'] = 'application/json';
              const res = await fetch(`${base}${path}`, {
                method: body ? 'POST' : 'GET',
                headers,
                body: body ? JSON.stringify(body) : undefined,
              });
              if (!res.ok) throw new Error(`Jira ${path}: ${res.status} ${await res.text()}`);
              return res.json();
            };

            const readVersionFromRef = async (ref) => {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path: VERSION_FILE, ref,
              });
              const text = Buffer.from(data.content, 'base64').toString('utf8');
              const m = text.match(/WIRE_SHORT_VERSION\s*=\s*(\S+)/);
              if (!m) throw new Error(`WIRE_SHORT_VERSION not found in ${ref}`);
              return m[1];
            };

            const compareSemver = (a, b) => {
              const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const x = pa[i] || 0, y = pb[i] || 0;
                if (x !== y) return x - y;
              }
              return 0;
            };

            // ── Resolve the three versions ────────────────────────────────────
            // Edge = WIRE_SHORT_VERSION on develop
            const edgeVersion = await readVersionFromRef('develop');

            // Beta = latest release/cycle-X.Y branch → its WIRE_SHORT_VERSION.
            // Paginate: this repo has hundreds of branches/tags, so a single page misses them.
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const cycles = branches
              .map(b => ({ name: b.name, m: b.name.match(/^release\/cycle-(\d+\.\d+)$/) }))
              .filter(b => b.m)
              .sort((a, b) => compareSemver(b.m[1], a.m[1]));
            if (cycles.length === 0) throw new Error('No release/cycle-* branches found');
            const betaBranch  = cycles[0].name;
            const betaVersion = await readVersionFromRef(betaBranch);

            // Prod = latest appstore/X.Y.Z tag (paginated for the same reason).
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const appstore = tags
              .map(t => ({ name: t.name, m: t.name.match(/^appstore\/(\d+\.\d+\.\d+)$/) }))
              .filter(t => t.m)
              .sort((a, b) => compareSemver(b.m[1], a.m[1]));
            if (appstore.length === 0) throw new Error('No appstore/* tags found');
            const prodTag     = appstore[0].name;
            const prodVersion = appstore[0].m[1];

            // ── Jira lookups ──────────────────────────────────────────────────
            const projectVersions = await jira(`/rest/api/3/project/${project}/versions`);

            const findJiraVersion = async (semver) => {
              const v = projectVersions.find(x => x.name === `iOS v${semver}`);
              if (!v) return null;
              // expand=driver returns the Release Hub driver as an Atlassian accountId string.
              return jira(`/rest/api/3/version/${v.id}?expand=driver`);
            };

            // We can't resolve accountId → displayName: the token's user lacks
            // "Browse users and groups". Link to the Jira profile instead.
            const driverLabel = (accountId) =>
              accountId
                ? `<${base}/jira/people/${accountId}|👤 Release captain>`
                : `⚠️ Release captain: Unassigned`;

            // Migrated from the removed /rest/api/3/search endpoint:
            //   list issues       → GET  /rest/api/3/search/jql        (no `total` in response)
            //   count only        → POST /rest/api/3/search/approximate-count
            const listIssues = async (jql, fields = ['summary', 'status']) => {
              const qs = new URLSearchParams({ jql, fields: fields.join(','), maxResults: '50' });
              return jira(`/rest/api/3/search/jql?${qs}`);
            };
            const countIssues = async (jql) => {
              const r = await jira('/rest/api/3/search/approximate-count', { jql });
              return r.count ?? 0;
            };
            // Escape backslashes and double-quotes before interpolating into a JQL "..." literal.
            const jqlEscape = (s) => s.replace(/\\/g, '\\\\').replace(/"/g, '\\"');

            const daysBetween = (isoDate) => {
              if (!isoDate) return null;
              const ms = new Date(isoDate).getTime() - Date.now();
              return Math.ceil(ms / 86_400_000);
            };

            const issueLink = (i) =>
              `<${base}/browse/${i.key}|${i.key}>`;

            // Slack-formatted link to a Jira version's release page; falls back to plain text
            // when the version isn't in Jira yet (e.g. edge before someone creates it).
            const releaseLink = (v, label) =>
              v ? `<${base}/projects/${project}/versions/${v.id}|${label}>` : label;

            const renderIssues = (issues, limit = 10) =>
              issues.slice(0, limit).map(i =>
                `    • ${issueLink(i)} — ${i.fields.status.name} — ${i.fields.summary}`);

            // Edge/LTS: bullets headered by status name, with assignee inline.
            const assigneeOf = (issue) => issue.fields.assignee?.displayName ?? 'Unassigned';
            const renderGroupedByStatus = (issues, perGroupLimit = 10) => {
              const groups = new Map();
              for (const i of issues) {
                const s = i.fields.status.name;
                if (!groups.has(s)) groups.set(s, []);
                groups.get(s).push(i);
              }
              const out = [];
              for (const [status, items] of [...groups.entries()].sort(([a], [b]) => a.localeCompare(b))) {
                out.push(`  • *${status}* (${items.length})`);
                for (const i of items.slice(0, perGroupLimit)) {
                  out.push(`    • ${issueLink(i)} — ${assigneeOf(i)} — ${i.fields.summary}`);
                }
              }
              return out;
            };

            // Prod: scope = the issue's Jira Components, with "iOS" hidden.
            const scopeOf = (issue) =>
              (issue.fields.components || [])
                .map(c => c.name)
                .filter(n => n && n.toLowerCase() !== 'ios')
                .join(', ') || null;
            const renderWithScope = (issues) => {
              const sorted = [...issues].sort((a, b) =>
                (scopeOf(a) ?? '').localeCompare(scopeOf(b) ?? ''));
              return sorted.map(i => {
                const scope = scopeOf(i);
                return `    • ${issueLink(i)}${scope ? ` — ${scope}` : ''} — ${i.fields.summary}`;
              });
            };

            // ── Edge: fixVersion ──────────────────────────────────────────────
            const edgeName       = `iOS v${edgeVersion}`;
            const edgeQ          = jqlEscape(edgeName);
            const edgeJira       = await findJiraVersion(edgeVersion);
            const daysToEdge     = edgeJira ? daysBetween(edgeJira.startDate) : null;
            const edgeTotalCount = await countIssues(`project = ${project} AND fixVersion = "${edgeQ}"`);
            const edgeOpenJql    = `project = ${project} AND fixVersion = "${edgeQ}" AND statusCategory != Done`;
            const edgeOpenCount  = await countIssues(edgeOpenJql);
            const edgeOpenItems  = edgeOpenCount > 0 ? (await listIssues(edgeOpenJql, ['summary', 'status', 'assignee'])).issues : [];
            const edgeQAJql      = `project = ${project} AND fixVersion = "${edgeQ}" AND status in ("Ready for QA", "In QA Review")`;
            const edgeQACount    = await countIssues(edgeQAJql);

            // ── Beta: affectedVersion + releaseDate ───────────────────────────
            const betaName          = `iOS v${betaVersion}`;
            const betaQ             = jqlEscape(betaName);
            const betaJira          = await findJiraVersion(betaVersion);
            const betaAffectedJql   = `project = ${project} AND affectedVersion = "${betaQ}"`;
            const betaAffectedCount = await countIssues(betaAffectedJql);
            const betaAffectedItems = betaAffectedCount > 0 ? (await listIssues(betaAffectedJql)).issues : [];
            const daysToBeta        = betaJira ? daysBetween(betaJira.releaseDate) : null;

            // ── Prod: affectedVersion + releaseDate ───────────────────────────
            const prodName          = `iOS v${prodVersion}`;
            const prodQ             = jqlEscape(prodName);
            const prodJira          = await findJiraVersion(prodVersion);
            const prodAffectedJql   = `project = ${project} AND affectedVersion = "${prodQ}" AND status not in ("Done", "Rejected")`;
            const prodAffectedCount = await countIssues(prodAffectedJql);
            const prodAffectedItems = prodAffectedCount > 0 ? (await listIssues(prodAffectedJql, ['summary', 'components'])).issues : [];
            const daysSinceProd     = prodJira ? -daysBetween(prodJira.releaseDate) : null;

            // ── LTS C Builds (optional, only if vars.LTS_RELEASE is set
            //                 and the Jira version isn't yet released) ────────
            let lts = null;
            if (process.env.LTS_RELEASE) {
              const ltsBranch  = process.env.LTS_RELEASE;
              const ltsVersion = await readVersionFromRef(ltsBranch);
              const ltsName    = `iOS v${ltsVersion}`;
              const ltsQ       = jqlEscape(ltsName);
              const ltsJira    = await findJiraVersion(ltsVersion);
              if (ltsJira?.released) {
                core.info(`LTS ${ltsName} is already released in Jira — skipping section`);
              } else {
                const ltsTotalJql = `project = ${project} AND fixVersion = "${ltsQ}"`;
                const ltsTotal    = await countIssues(ltsTotalJql);
                const ltsOpenJql  = `project = ${project} AND fixVersion = "${ltsQ}" AND statusCategory != Done`;
                const ltsOpen     = await countIssues(ltsOpenJql);
                const ltsOpenItems = ltsOpen > 0 ? (await listIssues(ltsOpenJql, ['summary', 'status', 'assignee'])).issues : [];
                const daysToLts  = ltsJira ? daysBetween(ltsJira.releaseDate) : null;
                lts = { ltsBranch, ltsName, ltsJira, ltsTotal, ltsOpen, ltsOpenItems, daysToLts };
              }
            }

            // ── GOV Builds (optional, only if vars.GOV_RELEASE is set
            //                and the Jira version isn't yet released) ────────
            let gov = null;
            if (process.env.GOV_RELEASE) {
              const govBranch  = process.env.GOV_RELEASE;
              const govVersion = await readVersionFromRef(govBranch);
              const govName    = `iOS v${govVersion}`;
              const govQ       = jqlEscape(govName);
              const govJira    = await findJiraVersion(govVersion);
              if (govJira?.released) {
                core.info(`GOV ${govName} is already released in Jira — skipping section`);
              } else {
                const govTotalJql = `project = ${project} AND fixVersion = "${govQ}"`;
                const govTotal    = await countIssues(govTotalJql);
                const govOpenJql  = `project = ${project} AND fixVersion = "${govQ}" AND statusCategory != Done`;
                const govOpen     = await countIssues(govOpenJql);
                const govOpenItems = govOpen > 0 ? (await listIssues(govOpenJql, ['summary', 'status', 'assignee'])).issues : [];
                const daysToGov  = govJira ? daysBetween(govJira.releaseDate) : null;
                gov = { govBranch, govName, govJira, govTotal, govOpen, govOpenItems, daysToGov };
              }
            }

            // ── Render Slack-flavoured Markdown ───────────────────────────────
            // Each live release is rendered as its own self-contained message so
            // they can be posted to Wire separately (one message per release).
            const dateTitle = `*🚀 iOS Release Status — ${new Date().toDateString()}*`;

            // Edge
            const edgeLines = [dateTitle, ''];
            edgeLines.push(`*🟢 Edge — ${releaseLink(edgeJira, edgeName)}*  _(develop)_`);
            edgeLines.push(`  • ${driverLabel(edgeJira?.driver)}`);
            if (daysToEdge != null) {
              const label = daysToEdge >= 0 ? 'until start' : 'past start';
              edgeLines.push(`  • ${Math.abs(daysToEdge)} day(s) ${label} (${edgeJira.startDate})`);
            }
            edgeLines.push(`  • ${edgeOpenCount} of ${edgeTotalCount} tickets not done`);
            if (edgeQACount > 0) {
              edgeLines.push(`  • 🎮 *${edgeQACount} ticket(s) in QA — Playtest recommended*`);
            }
            if (edgeVersion === betaVersion) {
              edgeLines.push(`  • ⚠️ *develop is still on ${edgeVersion} — bump \`WIRE_SHORT_VERSION\` now that \`${betaBranch}\` is cut*`);
            }
            if (edgeOpenCount > 0) {
              edgeLines.push(...renderGroupedByStatus(edgeOpenItems));
            }

            // Beta
            const betaLines = [dateTitle, ''];
            betaLines.push(`*🔵 Beta — ${releaseLink(betaJira, betaName)}*  _(\`${betaBranch}\`)_`);
            betaLines.push(`  • ${driverLabel(betaJira?.driver)}`);
            if (daysToBeta != null) {
              const label = daysToBeta >= 0 ? 'until release' : 'past release';
              betaLines.push(`  • ${Math.abs(daysToBeta)} day(s) ${label} (${betaJira.releaseDate})`);
            } else {
              betaLines.push(`  • ⚠️ no release date on Jira version`);
            }
            betaLines.push(`  • ${betaAffectedCount} ticket(s) with affectedVersion`);
            if (betaAffectedCount > 0) {
              betaLines.push(`  • 🔍 *Triage needed*`);
              betaLines.push(...renderIssues(betaAffectedItems));
            }

            // Prod
            const prodLines = [dateTitle, ''];
            prodLines.push(`*⚪ Prod — ${releaseLink(prodJira, prodName)}*  _(\`${prodTag}\`)_`);
            prodLines.push(`  • ${driverLabel(prodJira?.driver)}`);
            if (daysSinceProd != null) {
              prodLines.push(`  • ${daysSinceProd} day(s) since release (${prodJira.releaseDate})`);
            } else {
              prodLines.push(`  • ⚠️ no release date on Jira version`);
            }
            prodLines.push(`  • ${prodAffectedCount} ticket(s) with affectedVersion`);
            if (prodAffectedCount > 0) {
              prodLines.push(`  • 🔍 *Triage needed*`);
              prodLines.push(...renderWithScope(prodAffectedItems));
            }

            // LTS C Builds (optional)
            let ltsLines = null;
            if (lts) {
              ltsLines = [dateTitle, ''];
              ltsLines.push(`*⬜ LTS C Builds - ${releaseLink(lts.ltsJira, lts.ltsName)} (\`${lts.ltsBranch}\`)*`);
              ltsLines.push(`  • ${driverLabel(lts.ltsJira?.driver)}`);
              if (lts.daysToLts != null) {
                const label = lts.daysToLts >= 0 ? 'until release' : 'past release';
                ltsLines.push(`  • ${Math.abs(lts.daysToLts)} day(s) ${label} (${lts.ltsJira.releaseDate})`);
              } else {
                ltsLines.push(`  • ⚠️ no release date on Jira version`);
              }
              ltsLines.push(`  • ${lts.ltsOpen} of ${lts.ltsTotal} tickets not done`);
              if (lts.ltsOpen > 0) {
                ltsLines.push(...renderGroupedByStatus(lts.ltsOpenItems));
              }
            }

            // GOV Builds (optional)
            let govLines = null;
            if (gov) {
              govLines = [dateTitle, ''];
              govLines.push(`*⬛ GOV Builds - ${releaseLink(gov.govJira, gov.govName)} (\`${gov.govBranch}\`)*`);
              govLines.push(`  • ${driverLabel(gov.govJira?.driver)}`);
              if (gov.daysToGov != null) {
                const label = gov.daysToGov >= 0 ? 'until release' : 'past release';
                govLines.push(`  • ${Math.abs(gov.daysToGov)} day(s) ${label} (${gov.govJira.releaseDate})`);
              } else {
                govLines.push(`  • ⚠️ no release date on Jira version`);
              }
              govLines.push(`  • ${gov.govOpen} of ${gov.govTotal} tickets not done`);
              if (gov.govOpen > 0) {
                govLines.push(...renderGroupedByStatus(gov.govOpenItems));
              }
            }

            const edgeMsg = edgeLines.join('\n');
            const betaMsg = betaLines.join('\n');
            const prodMsg = prodLines.join('\n');
            const ltsMsg  = ltsLines ? ltsLines.join('\n') : '';
            const govMsg  = govLines ? govLines.join('\n') : '';

            // LTS/GOV are '' when their vars aren't configured — their post steps are skipped.
            core.setOutput('edge', edgeMsg);
            core.setOutput('beta', betaMsg);
            core.setOutput('prod', prodMsg);
            core.setOutput('lts', ltsMsg);
            core.setOutput('gov', govMsg);

            await core.summary
              .addRaw([edgeMsg, betaMsg, prodMsg, ltsMsg, govMsg].filter(Boolean).join('\n\n'))
              .write();

      - name: Post Edge to Wire
        if: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK != '' }}
        uses: ./.github/actions/notify-wire
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK }}
        with:
          notify: custom
          text: ${{ steps.build.outputs.edge }}

      - name: Post Beta to Wire
        if: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK != '' }}
        uses: ./.github/actions/notify-wire
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK }}
        with:
          notify: custom
          text: ${{ steps.build.outputs.beta }}

      - name: Post Prod to Wire
        if: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK != '' }}
        uses: ./.github/actions/notify-wire
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK }}
        with:
          notify: custom
          text: ${{ steps.build.outputs.prod }}

      - name: Post LTS to Wire
        if: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK != '' && steps.build.outputs.lts != '' }}
        uses: ./.github/actions/notify-wire
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK }}
        with:
          notify: custom
          text: ${{ steps.build.outputs.lts }}

      - name: Post GOV to Wire
        if: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK != '' && steps.build.outputs.gov != '' }}
        uses: ./.github/actions/notify-wire
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WIRE_IOS_RELEASE_WEBHOOK }}
        with:
          notify: custom
          text: ${{ steps.build.outputs.gov }}
