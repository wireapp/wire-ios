on:
  # Allow running it manually from the Actions tab (e.g. to prefill release notes).
  workflow_dispatch:
    inputs:
      is_cloud_build:
        description: 'Compare appstore/* tags (cloud build). Uncheck to compare build/bk_* tags.'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      is_cloud_build:
        required: true
        type: boolean
        default: true
    secrets:
      JIRA_TOKEN:
        required: false
    outputs:
      changelog-url:
        description: "The url of the changelog can be downloaded from"
        value: ${{ jobs.changelog.outputs.changelog-url }}
      changelog-name:
        description: "The name of the changelog file"
        value: ${{ jobs.changelog.outputs.changelog-name }}

env: # https://docs.fastlane.tools/getting-started/ios/setup/
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8

jobs:
  changelog:
    runs-on: ubuntu-24.04
    outputs:
      changelog-url: ${{ steps.expose-url.outputs.changelog }}
      changelog-name: ${{ steps.expose-url.outputs.changelog-name }}
    steps:
      - name: 'Checkout Git repository with history for all branches and tags'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'false'
          fetch-depth: 0
      - name: 'Tag regex'
        id: regex
        run: |
          if [ "true" == "${IS_CLOUD_BUILD}" ]; then
            echo "regex='appstore/[0-9]+\.[0-9]+\.[0-9]*'" >> $GITHUB_ENV
          else
            echo "regex='build/bk_[0-9]+\.[0-9]+\.[0-9]*'" >> $GITHUB_ENV
          fi
        env:
          IS_CLOUD_BUILD: ${{ inputs.is_cloud_build }}
      - name: 'Calculate diff between HEAD and latest tag'
        run: echo "HEAD_TAG_DIFF=$(git diff HEAD $(git tag | grep -E '${{ env.regex }}' | tail -n 1) | wc -l | xargs)" >> "$GITHUB_ENV"

      - name: 'Set current Git tag to HEAD'
        if: "${{ env.HEAD_TAG_DIFF != '0' }}"
        run: echo "CURRENT_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: 'Set previous Git tag to latest tag if comparing to head'
        if: "${{ env.HEAD_TAG_DIFF != '0' }}"
        run: echo "PREVIOUS_TAG=$(git tag | grep -E '${{ env.regex }}' | sort -V | tail -n 1)" >> "$GITHUB_ENV"

      - name: 'Set current Git tag to latest tagged commit'
        if: "${{ env.HEAD_TAG_DIFF == '0' }}"
        run: echo "CURRENT_TAG=$(git tag | grep -E '${{ env.regex }}' | sort -V | tail -n 1)" >> "$GITHUB_ENV"
      - name: 'Set previous Git tag previous tag because head is latest tag'
        if: "${{ env.HEAD_TAG_DIFF == '0' }}"
        run: echo "PREVIOUS_TAG=$(git tag | grep -E '${{ env.regex }}' | sort -V | tail -n 2 | head -n 1)" >> "$GITHUB_ENV"

      - name: 'Print environment variables'
        run: |
          echo -e "PREVIOUS_TAG = $PREVIOUS_TAG"
          echo -e "CURRENT_TAG = $CURRENT_TAG"
          echo -e "Node.js version = $(node --version)"

      - name: 'Generate changelog'
        run: |
          echo "{}" > ./package.json
          npx generate-changelog@1.8.0 -t "$PREVIOUS_TAG..$CURRENT_TAG" --repo-url https://github.com/wireapp/wire-ios
          cat CHANGELOG.md | grep -v '🍒' > CHANGELOG1.md
          mv CHANGELOG1.md CHANGELOG.md

      # Rewrite each ticket line as "<JIRA title> - WPB-XXX" (no links), so the
      # changelog reads like release notes instead of raw commit messages.
      # Lines without a WPB-xxxx key, or tickets we can't fetch, keep their commit
      # subject; links are stripped from every bullet either way.
      - name: 'Resolve JIRA titles'
        continue-on-error: true
        env:
          JIRA_BASE_URL: https://wearezeta.atlassian.net
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: ruby ./scripts/resolve_changelog_jira_titles.rb

      - name: 'Set date variable'
        id: date
        run: echo "date=$(date +%s%N)" >> $GITHUB_OUTPUT

      - name: 'Upload changelog'
        id: upload-file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CHANGELOG-${{ github.run_number }}-${{ steps.date.outputs.date }}.md
          path: ./CHANGELOG.md
          if-no-files-found: error
          overwrite: true

      - name: Expose url of changelog
        id: expose-url
        run: |
          echo "changelog=${{ steps.upload-file.outputs.artifact-url }}" >> $GITHUB_OUTPUT
          echo "changelog-name=CHANGELOG-${GITHUB_RUN_NUMBER}-${{ steps.date.outputs.date }}.md" >> $GITHUB_OUTPUT
