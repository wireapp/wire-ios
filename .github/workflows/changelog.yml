on:
  workflow_call:
    inputs:
      is_cloud_build:
        required: true
        type: boolean
        default: true
    outputs:
      changelog-url:
        description: "The url of the changelog can be downloaded from"
        value: ${{ jobs.changelog.outputs.changelog-url }}
      changelog-name:
        description: "The name of the changelog file"
        value: ${{ jobs.changelog.outputs.changelog-name }}

env: # https://docs.fastlane.tools/getting-started/ios/setup/
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8

jobs:
  changelog:
    runs-on: ubuntu-24.04
    outputs:
      changelog-url: ${{ steps.expose-url.outputs.changelog }}
      changelog-name: ${{ steps.expose-url.outputs.changelog-name }}
    steps:
      - name: 'Checkout Git repository with history for all branches and tags'
        uses: actions/checkout@v4
        with:
          lfs: 'false'
          fetch-depth: 0
      - name: 'Tag regex'
        id: regex
        run: |
          if [ "true" == "${IS_CLOUD_BUILD}" ]; then
            echo "regex='appstore/[0-9]+\.[0-9]+\.[0-9]*'" >> $GITHUB_ENV
          else
            echo "regex='build/bk_[0-9]+\.[0-9]+\.[0-9]*'" >> $GITHUB_ENV
          fi
        env:
          IS_CLOUD_BUILD: ${{ inputs.is_cloud_build }}
      - name: 'Calculate diff between HEAD and latest tag'
        run: echo "HEAD_TAG_DIFF=$(git diff HEAD $(git tag | grep -E '${{ env.regex }}' | tail -n 1) | wc -l | xargs)" >> "$GITHUB_ENV"

      - name: 'Set current Git tag to HEAD'
        if: "${{ env.HEAD_TAG_DIFF != '0' }}"
        run: echo "CURRENT_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: 'Set previous Git tag to latest tag if comparing to head'
        if: "${{ env.HEAD_TAG_DIFF != '0' }}"
        run: echo "PREVIOUS_TAG=$(git tag | grep -E '${{ env.regex }}' | sort -V | tail -n 1)" >> "$GITHUB_ENV"

      - name: 'Set current Git tag to latest tagged commit'
        if: "${{ env.HEAD_TAG_DIFF == '0' }}"
        run: echo "CURRENT_TAG=$(git tag | grep -E '${{ env.regex }}' | sort -V | tail -n 1)" >> "$GITHUB_ENV"
      - name: 'Set previous Git tag previous tag because head is latest tag'
        if: "${{ env.HEAD_TAG_DIFF == '0' }}"
        run: echo "PREVIOUS_TAG=$(git tag | grep -E '${{ env.regex }}' | sort -V | tail -n 2 | head -n 1)" >> "$GITHUB_ENV"

      - name: 'Print environment variables'
        run: |
          echo -e "PREVIOUS_TAG = $PREVIOUS_TAG"
          echo -e "CURRENT_TAG = $CURRENT_TAG"
          echo -e "Node.js version = $(node --version)"

      - name: 'Generate changelog'
        run: |
          echo "{}" > ./package.json
          npx generate-changelog@1.8.0 -t "$PREVIOUS_TAG..$CURRENT_TAG" --repo-url https://github.com/wireapp/wire-ios
          cat CHANGELOG.md | grep -v '🍒' > CHANGELOG1.md
          mv CHANGELOG1.md CHANGELOG.md

      # Replace each commit subject with the title (summary) of its JIRA ticket,
      # so the changelog reads like release notes instead of raw commit messages.
      # Lines without a WPB-xxxx key, or tickets we can't fetch, are left as-is.
      - name: 'Resolve JIRA titles'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: https://wearezeta.atlassian.net
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const path = 'CHANGELOG.md';
            const base = process.env.JIRA_BASE_URL;
            const token = process.env.JIRA_TOKEN;
            if (!token) {
              core.warning('JIRA_TOKEN not set — keeping commit titles');
              return;
            }
            const auth = `Basic ${Buffer.from(token).toString('base64')}`;
            const cache = new Map();
            const titleFor = async (key) => {
              if (cache.has(key)) return cache.get(key);
              let summary = null;
              try {
                const res = await fetch(`${base}/rest/api/3/issue/${key}?fields=summary`, {
                  headers: { Authorization: auth, Accept: 'application/json' },
                });
                if (res.ok) {
                  const json = await res.json();
                  summary = json.fields && json.fields.summary;
                  // Tickets are often prefixed with a platform tag like "[iOS] " — drop it.
                  if (summary) summary = summary.replace(/^\s*\[[^\]]*\]\s*/, '');
                } else {
                  core.warning(`Jira ${key}: ${res.status} ${await res.text()}`);
                }
              } catch (e) {
                core.warning(`Jira ${key}: ${e.message}`);
              }
              cache.set(key, summary);
              return summary;
            };

            const lines = fs.readFileSync(path, 'utf8').split('\n');
            const out = [];
            for (const line of lines) {
              const keyMatch = line.match(/WPB-\d+/i);
              if (!line.startsWith('*') || !keyMatch) {
                out.push(line);
                continue;
              }
              const key = keyMatch[0].toUpperCase();
              const summary = await titleFor(key);
              if (!summary) {
                out.push(line);
                continue;
              }
              // Preserve the trailing commit-sha link that generate-changelog appends.
              const tail = (line.match(/(\s*\[[0-9a-f]{6,}\]\([^)]+\))\s*$/i) || [, ''])[1];
              out.push(`* ${summary} ([${key}](${base}/browse/${key}))${tail}`);
            }
            fs.writeFileSync(path, out.join('\n'));
            core.info(`Resolved ${cache.size} JIRA ticket(s) in the changelog.`);

      - name: 'Set date variable'
        id: date
        run: echo "date=$(date +%s%N)" >> $GITHUB_OUTPUT

      - name: 'Upload changelog'
        id: upload-file
        uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG-${{ github.run_number }}-${{ steps.date.outputs.date }}.md
          path: ./CHANGELOG.md
          if-no-files-found: error
          overwrite: true

      - name: Expose url of changelog
        id: expose-url
        run: |
          echo "changelog=${{ steps.upload-file.outputs.artifact-url }}" >> $GITHUB_OUTPUT
          echo "changelog-name=CHANGELOG-${{ github.run_number }}-${{ steps.date.outputs.date }}.md" >> $GITHUB_OUTPUT
