name: Symbolicate C3 19629 launch crash

on:
  workflow_dispatch:
    inputs:
      dwarf_uuid:
        description: Mach-O UUID
        type: string
        required: true
      load_address:
        description: Runtime load address
        type: string
        required: true
      frame_addresses:
        description: Wire frame addresses
        type: string
        required: true

permissions: {}

jobs:
  symbolicate:
    runs-on: [self-hosted, in-house, delivery]
    timeout-minutes: 10
    steps:
      - name: Configure Wire artifact access
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - name: Resolve the Wire frames
        shell: bash
        env:
          C3_RELEASE_FOLDER: ${{ secrets.C3_S3_SUBFOLDER_RESTRICTED }}
          DSYM_UUID: ${{ inputs.dwarf_uuid }}
          LOAD_ADDRESS: ${{ inputs.load_address }}
          FRAME_ADDRESSES: ${{ inputs.frame_addresses }}
        run: |
          set -euo pipefail
          hex_address='^0x[0-9a-fA-F]+$'
          uuid_pattern='^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
          [[ -n "$C3_RELEASE_FOLDER" && "$DSYM_UUID" =~ $uuid_pattern && "$LOAD_ADDRESS" =~ $hex_address ]]
          read -r -a frames <<< "$FRAME_ADDRESSES"
          for frame in "${frames[@]}"; do
            [[ "$frame" =~ $hex_address ]]
          done

          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"' EXIT
          filename=Wire-rc-release_cycle-4.29-19629
          prefix="ios/$C3_RELEASE_FOLDER/release/device/release/$filename/"
          location="s3://z-lohika/$prefix"
          if ! aws s3 cp "$location$filename.app.dSYM.zip" "$stage/symbols.zip" --only-show-errors 2>"$stage/download-error"; then
            if ! aws s3 cp "${location}Wire.app.dSYM.zip" "$stage/symbols.zip" --only-show-errors 2>"$stage/download-error"; then
              echo "::error::No dSYM archive at the expected release artifact keys"
              exit 1
            fi
          fi
          ditto -x -k "$stage/symbols.zip" "$stage/symbols"

          dwarf=""
          while IFS= read -r -d '' candidate; do
            if xcrun dwarfdump --uuid "$candidate" | grep -Fi "UUID: $DSYM_UUID" | grep -Fq "(arm64)"; then
              dwarf=$candidate
              break
            fi
          done < <(find "$stage/symbols" -type f -path '*/Contents/Resources/DWARF/Wire' -print0)

          if [[ -z "$dwarf" ]]; then
            echo "::error::The release archive has no Wire arm64 dSYM with the crash report UUID"
            exit 1
          fi
          echo "Verified Wire arm64 UUID $DSYM_UUID"
          xcrun atos -arch arm64 -o "$dwarf" -l "$LOAD_ADDRESS" "${frames[@]}"
