name: Nightly Tests

on:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'macOS runner'
        type: choice
        options:
          - in-house
          - cirrus
          - github
        default: in-house
      uitest_parallel_workers:
        description: 'UITest parallel simulator workers'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
        default: '2'
  schedule:
    - cron: "0 21 * * MON-FRI"
  
# This is what will cancel the workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger_tests:
    if: ${{ github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/_reusable_run_tests.yml
    with:
      all: false
      branch: develop
      mac_runner: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_runner || vars.DEFAULT_MAC_RUNNER }}
      run_critical_flows: true
      ui_test_tags: "!critical"
      uitest_parallel_workers: ${{ github.event_name == 'workflow_dispatch' && inputs.uitest_parallel_workers || vars.UITEST_PARALLEL_WORKERS || '2' }}
      notify: always
      timeout_minutes: 120
    secrets:
      ZENKINS_USERNAME: ${{ secrets.ZENKINS_USERNAME }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      WIRE_WEBHOOK_URL: ${{ secrets.WIRE_IOS_NIGHTLY_URL }}
      WIRE_WEBHOOK_TOKEN: ${{ secrets.WIRE_IOS_NIGHTLY_TOKEN }}
